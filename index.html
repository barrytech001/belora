<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --green: #0b5d3b;
    --green-soft: #e3f1e9;
    --ink: #0e1a14;
    --muted: #5b6b62;
    --mist: #f1f5f2;
    --line: #dde6e0;
    --warn: #b45309;
    --warn-soft: #fdf0dc;
    --paper: #ffffff;
    --display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 16px/1.45 var(--body); color: var(--ink); background: var(--mist); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .hide { display: none !important; }

  /* top bar */
  .top { flex: none; height: 56px; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--line); z-index: 1300; position: relative; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; color: var(--green); display: flex; align-items: center; gap: 8px; }
  .brand i { width: 12px; height: 12px; border-radius: 50%; background: var(--green); display: inline-block; box-shadow: 0 0 0 4px var(--green-soft); }
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tabs button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; }
  .tabs button.on { background: var(--green); color: #fff; }
  .powered { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  @media (max-width: 700px) { .powered { display: none; } }

  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; }

  /* order: map + floating sheet */
  #map { position: absolute; inset: 0; }
  .sheet { position: absolute; z-index: 1200; background: var(--paper); display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(14, 26, 20, .18); }
  .sheet-body { overflow: auto; padding: 20px 20px 8px; flex: 1; }
  @media (min-width: 820px) { .sheet { left: 16px; top: 16px; bottom: 16px; width: 430px; border-radius: 20px; } }
  @media (max-width: 819px) { .sheet { left: 0; right: 0; bottom: 0; max-height: 68%; border-radius: 20px 20px 0 0; } }

  h1 { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 6px; }
  .lede { margin: 0 0 18px; color: var(--muted); }

  .route { position: relative; padding-left: 30px; }
  .route::before { content: ""; position: absolute; left: 9px; top: 26px; bottom: 26px; border-left: 2px dashed #b9c9bf; }
  .stop { position: relative; margin-bottom: 14px; }
  .stop::before { content: ""; position: absolute; left: -29px; top: 14px; width: 14px; height: 14px; background: var(--green); border-radius: 50%; box-shadow: 0 0 0 4px var(--green-soft); }
  .stop.drop::before { background: var(--ink); border-radius: 3px; box-shadow: 0 0 0 4px #e2e6e3; }
  .field { position: relative; }
  .stop input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--mist); font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  .stop input::placeholder { font-weight: 400; letter-spacing: 0; color: #8a9a91; }
  .stop input:focus { border-color: var(--green); background: #fff; outline: none; }
  .sug { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(14, 26, 20, .15); max-height: 220px; overflow: auto; }
  .sug div { padding: 11px 14px; cursor: pointer; border-bottom: 1px solid var(--mist); font-size: 15px; }
  .sug div:last-child { border-bottom: 0; }
  .sug div:hover { background: var(--green-soft); }
  .sug .empty { color: var(--muted); cursor: default; }
  .sug .empty:hover { background: #fff; }

  .info { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .info .where { margin-top: 6px; color: var(--ink); font-weight: 600; }
  .info .warn { color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; }
  .code { display: flex; gap: 6px; }
  .seg { flex: 1; min-width: 0; text-align: center; padding: 7px 4px 5px; border-radius: 10px; background: var(--green-soft); color: var(--green); font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .seg:first-child { background: var(--green); color: #fff; }
  .seg small { display: block; margin-top: 2px; font-family: var(--body); font-weight: 500; font-size: 11px; letter-spacing: 0; opacity: .85; }

  .details { margin: 4px 0 14px; }
  .details summary { cursor: pointer; color: var(--green); font-weight: 600; padding: 6px 0; }
  .details textarea { width: 100%; margin-top: 8px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--mist); resize: vertical; }
  .btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 700; }
  .btn.primary { background: var(--green); color: #fff; }
  .btn.soft { background: var(--green-soft); color: var(--green); }
  .btn.small { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .chip { display: inline-block; background: var(--green-soft); color: var(--green); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; margin: 2px 4px 2px 0; }
  .cand { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; font-size: 14px; }
  .cand b { font-family: var(--display); }
  .cand .acts { display: flex; gap: 6px; flex: none; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .contact { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 6px; }
  .contact input { width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--mist); }
  .contact input:focus { border-color: var(--green); background: #fff; outline: none; }
  .demo { margin: 10px 0 14px; font-size: 13px; color: var(--muted); }
  .demo button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; margin: 4px 6px 0 0; font-size: 13px; }
  .demo button:hover { background: var(--green-soft); }
  .note { font-size: 13px; color: var(--warn); margin: 6px 0 10px; }

  .bar { flex: none; display: flex; align-items: center; gap: 16px; padding: 12px 20px 16px; border-top: 1px solid var(--line); background: #fff; }
  .stat small { display: block; font-size: 12px; color: var(--muted); }
  .stat b { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; }
  .bar .btn { margin-left: auto; padding: 13px 20px; font-size: 16px; }

  .pin { width: 18px; height: 18px; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
  .pin.p { background: var(--green); border-radius: 50%; }
  .pin.d { background: var(--ink); border-radius: 4px; }

  /* dispatch */
  #t-dispatch { display: grid; grid-template-columns: 440px 1fr; }
  .board { overflow: auto; padding: 18px; background: var(--mist); }
  .board h2, .trackwrap h2 { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; margin: 0 0 12px; }
  #map2 { height: 100%; }
  @media (max-width: 819px) { #t-dispatch { grid-template-columns: 1fr; grid-template-rows: 260px 1fr; } #map2 { grid-row: 1; } .board { grid-row: 2; } }
  .ocard { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .ohead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ohead b { font-family: var(--display); font-size: 18px; }
  .st { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--mist); color: var(--muted); }
  .st.assigned { background: var(--warn-soft); color: var(--warn); }
  .st.picked_up { background: #e2eefb; color: #1d4f91; }
  .st.delivered { background: var(--green-soft); color: var(--green); }
  .route-line { margin: 8px 0; font-size: 14px; font-weight: 600; word-break: break-word; }
  .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .riders { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .empty-state { color: var(--muted); padding: 24px 8px; text-align: center; }

  /* track */
  .trackwrap { height: 100%; overflow: auto; padding: 22px 16px; }
  .trackin { max-width: 560px; margin: 0 auto; }
  .tcard { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .steps { list-style: none; margin: 14px 0 4px; padding: 0 0 0 6px; }
  .steps li { position: relative; padding: 0 0 14px 26px; color: #8a9a91; font-weight: 600; }
  .steps li::before { content: ""; position: absolute; left: 0; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid #c8d4cc; }
  .steps li::after { content: ""; position: absolute; left: 6px; top: 20px; bottom: -3px; border-left: 2px solid #dfe7e2; }
  .steps li:last-child::after { display: none; }
  .steps li.done { color: var(--ink); }
  .steps li.done::before { background: var(--green); border-color: var(--green); }
  .steps li.done::after { border-color: var(--green); }

  .leaflet-container { font-family: var(--body); }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><i></i>Belora</div>
  <nav class="tabs" aria-label="Sections">
    <button data-t="order" class="on">Order</button>
    <button data-t="dispatch">Dispatch</button>
    <button data-t="track">Track</button>
  </nav>
  <span class="powered">Powered by the NIPOST postcode</span>
</header>

<main>
  <!-- ORDER -->
  <section id="t-order" class="view">
    <div id="map" aria-label="Map"></div>
    <div class="sheet">
      <div class="sheet-body">
        <h1>Every address, one code.</h1>
        <p class="lede">Enter a postcode. Belora confirms the building, prices the trip and finds the nearest rider.</p>

        <div class="route">
          <div class="stop pickup">
            <div class="field">
              <input id="pickup" placeholder="Pickup postcode" autocomplete="off" aria-label="Pickup postcode">
              <div id="sug-pickup" class="sug hide"></div>
            </div>
            <div id="info-pickup" class="info"></div>
          </div>
          <div class="stop drop">
            <div class="field">
              <input id="drop" placeholder="Drop-off postcode" autocomplete="off" aria-label="Drop-off postcode">
              <div id="sug-drop" class="sug hide"></div>
            </div>
            <div id="info-drop" class="info"></div>
          </div>
        </div>

        <details class="details">
          <summary>Don't know the code? Describe the place</summary>
          <textarea id="free" rows="2" placeholder="For example: near the National Mosque, Abuja"></textarea>
          <div style="margin-top:8px"><button class="btn soft small" id="resolveBtn">Find postcode</button></div>
          <div id="resolveOut"></div>
        </details>

        <div class="contact">
          <input id="cname" placeholder="Your name" aria-label="Your name">
          <input id="cphone" placeholder="Phone number" aria-label="Phone number" inputmode="tel">
        </div>

        <div class="demo">Demo codes: tap to use
          <div id="demoChips"></div>
        </div>
        <div id="mapNote" class="note"></div>
      </div>
      <div class="bar">
        <div class="stat"><small>Distance</small><b id="dist">-</b></div>
        <div class="stat"><small>Delivery fee</small><b id="fee">-</b></div>
        <button class="btn primary" id="placeBtn" disabled>Place order</button>
      </div>
    </div>
  </section>

  <!-- DISPATCH -->
  <section id="t-dispatch" class="view hide">
    <div class="board">
      <h2>Orders</h2>
      <div id="riders" class="riders"></div>
      <div id="orders"></div>
    </div>
    <div id="map2"></div>
  </section>

  <!-- TRACK -->
  <section id="t-track" class="view hide">
    <div class="trackwrap"><div class="trackin">
      <h2>Track an order</h2>
      <div id="trackBox"></div>
    </div></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const ABUJA = [9.0765, 7.3986];
const RIDERS = [
  { id: "r1", name: "Musa",  lat: 9.0765, lng: 7.3986 },
  { id: "r2", name: "Chika", lat: 9.0579, lng: 7.4951 },
  { id: "r3", name: "Tunde", lat: 9.0300, lng: 7.4700 },
];
const FEE_BASE = 500, FEE_PER_KM = 150;
const DEMO_CODES = ["FC-01-A01-KP-27", "FC-01-A01-LR-01", "FC-01-A01-MH-01"];

const store = {
  get orders() { try { return JSON.parse(localStorage.getItem("belora_orders") || "[]"); } catch { return []; } },
  set orders(v) { try { localStorage.setItem("belora_orders", JSON.stringify(v)); } catch {} },
};

function haversine(a, b) {
  const R = 6371, rad = (x) => x * Math.PI / 180;
  const dLat = rad(b[0]-a[0]), dLng = rad(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const naira = (n) => "₦" + Number(n).toLocaleString();
const norm = (c) => (c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Postcode as a segmented plate: state, LGA, district, area, unit.
function plate(code) {
  const c = norm(code);
  if (c.length !== 11) return "";
  const parts = [c.slice(0,2), c.slice(2,4), c.slice(4,7), c.slice(7,9), c.slice(9,11)];
  const names = ["State", "LGA", "District", "Area", "Unit"];
  return `<div class="code">${parts.map((s, i) => `<div class="seg">${s}<small>${names[i]}</small></div>`).join("")}</div>`;
}

// The API's exact response shapes weren't confirmed, so these read defensively.
function listFrom(body) {
  const d = body && body.data;
  const arr = Array.isArray(d) ? d : (d && (d.results || d.suggestions)) || [];
  return arr.map((x) => typeof x === "string"
    ? { code: x, label: x }
    : { code: x.postcode || x.code, label: [x.postcode || x.code, x.display || x.name || x.address].filter(Boolean).join(" · ") }
  ).filter((x) => x.code);
}
function coordsFrom(data) {
  if (!data) return null;
  const c = data.location || data.coordinates || data;
  const lat = c.lat ?? c.latitude, lng = c.lng ?? c.lon ?? c.longitude;
  return (typeof lat === "number" && typeof lng === "number") ? [lat, lng] : null;
}
function fallbackCoords(code) { // deterministic spread around Abuja when the API gives no coordinates
  let h = 0; for (const ch of norm(code)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return [ABUJA[0] + ((h % 1000) / 1000 - .5) * 0.12, ABUJA[1] + (((h >> 10) % 1000) / 1000 - .5) * 0.12];
}

async function api(op, params) {
  const qs = new URLSearchParams({ op, ...params });
  const r = await fetch("/api/pc?" + qs);
  return { status: r.status, body: await r.json().catch(() => ({})) };
}

// ---------- maps ----------
const mk = (el) => {
  const m = L.map(el, { zoomControl: false }).setView(ABUJA, 11);
  L.control.zoom({ position: "topright" }).addTo(m);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(m);
  return m;
};
const map = mk("map"), map2 = mk("map2");
const pinIcon = (kind) => L.divIcon({ className: "", html: `<div class="pin ${kind}"></div>`, iconSize: [18, 18], iconAnchor: [9, 9] });
const pins = {}; let line = null;
const wide = () => window.innerWidth >= 820;

// ---------- tabs ----------
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  ["order", "dispatch", "track"].forEach((t) => $("t-" + t).classList.toggle("hide", t !== b.dataset.t));
  if (b.dataset.t === "dispatch") { renderDispatch(); setTimeout(() => map2.invalidateSize(), 50); }
  if (b.dataset.t === "track") renderTrack();
  if (b.dataset.t === "order") setTimeout(() => map.invalidateSize(), 50);
});

// ---------- postcode pickers ----------
const sel = { pickup: null, drop: null };

function wirePicker(key, inputId, sugId, infoId) {
  const input = $(inputId), sug = $(sugId); let timer;
  input.addEventListener("input", () => {
    sel[key] = null; $(infoId).innerHTML = ""; refresh();
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2) { sug.classList.add("hide"); return; }
    timer = setTimeout(async () => {
      const { status, body } = await api("autocomplete", { q });
      if (status !== 200) { sug.innerHTML = `<div class="empty">Error ${status}: ${esc((body.error && (body.error.message || body.error)) || "request failed")}</div>`; sug.classList.remove("hide"); return; }
      const items = listFrom(body);
      sug.innerHTML = items.length ? "" : '<div class="empty">No suggestions. Press Enter to check the full code.</div>';
      items.forEach((it) => { const d = document.createElement("div"); d.textContent = it.label; d.onclick = () => choose(key, it, input, sug, $(infoId)); sug.appendChild(d); });
      sug.classList.remove("hide");
    }, 250);
  });
  // allow typing or pasting a full code and pressing Enter
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") choose(key, { code: input.value.trim(), label: input.value.trim() }, input, sug, $(infoId)); });
}

async function choose(key, it, input, sug, info) {
  it.code = (it.code || "").trim().toUpperCase();
  input.value = it.code; sug.classList.add("hide");
  info.textContent = "Checking with NIPOST...";
  // Try a richer level first (address details); fall back to level 1 (validity only) if the key lacks access.
  let { status, body } = await api("lookup", { code: it.code, level: 3 });
  if (status !== 200) ({ status, body } = await api("lookup", { code: it.code, level: 1 }));
  const d = body && body.data;
  if (status !== 200 || !d || d.valid === false) {
    info.innerHTML = `<div class="warn">NIPOST doesn't recognise this code${status !== 200 ? " (error " + status + ")" : ""}. Check it and try again.</div>`;
    sel[key] = null; refresh(); return;
  }
  const a = d.administrative_address || {};
  const where = [a.locality_name, a.lga_name, a.state_name].filter(Boolean).join(", ");
  const house = d.recent_house_address && d.recent_house_address.recent;
  info.innerHTML = plate(d.postcode || it.code) +
    `<div class="where">${esc(where || "Valid postcode")}${house ? " · " + esc(house) : ""}</div>`;
  const real = coordsFrom(d);
  sel[key] = { code: d.postcode || it.code, coords: real || fallbackCoords(it.code), approx: !real };
  refresh();
}

wirePicker("pickup", "pickup", "sug-pickup", "info-pickup");
wirePicker("drop", "drop", "sug-drop", "info-drop");

// demo chips
DEMO_CODES.forEach((c) => {
  const b = document.createElement("button"); b.textContent = c;
  b.onclick = () => {
    const key = !sel.pickup ? "pickup" : "drop";
    choose(key, { code: c }, $(key), $("sug-" + key), $("info-" + key));
  };
  $("demoChips").appendChild(b);
});

let km = null, fee = null;
function refresh() {
  [["pickup", "p"], ["drop", "d"]].forEach(([k, cls]) => {
    if (pins[k]) { map.removeLayer(pins[k]); pins[k] = null; }
    if (sel[k]) pins[k] = L.marker(sel[k].coords, { icon: pinIcon(cls) }).addTo(map).bindPopup((k === "pickup" ? "Pickup: " : "Drop-off: ") + sel[k].code);
  });
  if (line) { map.removeLayer(line); line = null; }
  km = fee = null;
  $("mapNote").textContent = "";
  if (sel.pickup && sel.drop) {
    km = haversine(sel.pickup.coords, sel.drop.coords);
    fee = Math.round((FEE_BASE + FEE_PER_KM * km) / 50) * 50;
    line = L.polyline([sel.pickup.coords, sel.drop.coords], { color: "#0b5d3b", weight: 4 }).addTo(map);
    map.fitBounds(line.getBounds(), {
      paddingTopLeft: [wide() ? 460 : 30, 60],
      paddingBottomRight: [30, wide() ? 60 : Math.round(window.innerHeight * 0.5)],
    });
    if (sel.pickup.approx || sel.drop.approx) $("mapNote").textContent = "Demo note: the test data has no coordinates, so pins are approximate and distance is in a straight line.";
  } else if (sel.pickup || sel.drop) {
    map.setView((sel.pickup || sel.drop).coords, 13);
  }
  $("dist").textContent = km == null ? "-" : km.toFixed(1) + " km";
  $("fee").textContent = fee == null ? "-" : naira(fee);
  $("placeBtn").disabled = !(sel.pickup && sel.drop);
}

// ---------- AI resolver ----------
$("resolveBtn").onclick = async () => {
  const text = $("free").value.trim(); if (!text) return;
  const out = $("resolveOut"); out.innerHTML = '<div class="hint">Searching...</div>';
  try {
    const r = await fetch("/api/resolve?text=" + encodeURIComponent(text));
    const b = await r.json();
    if (!r.ok) { out.innerHTML = `<div class="info"><div class="warn">${esc(b.error || "Search failed. Try again.")}</div></div>`; return; }
    out.innerHTML = `<div class="hint">Searched for ${b.keywords.map((k) => `<span class="chip">${esc(k)}</span>`).join("")}${b.usedAI ? "" : "(AI is off, so your own words were used)"}</div>` +
      (b.candidates.length ? "" : '<div class="info"><div class="warn">No postcodes found. The test key only covers a few public places in Abuja.</div></div>');
    b.candidates.forEach((c) => {
      const label = typeof c.raw === "string" ? c.raw : [c.code, c.raw.display || c.raw.name || c.raw.address].filter(Boolean).join(" · ");
      const d = document.createElement("div"); d.className = "cand";
      d.innerHTML = `<span><b>${esc(c.code)}</b>${label !== c.code ? "<br>" + esc(label.replace(c.code + " · ", "")) : ""}</span><span class="acts"><button class="btn soft small" data-k="pickup">Pickup</button><button class="btn soft small" data-k="drop">Drop-off</button></span>`;
      d.querySelectorAll("button").forEach((btn) => btn.onclick = () => {
        const key = btn.dataset.k;
        choose(key, { code: c.code }, $(key), $("sug-" + key), $("info-" + key));
      });
      out.appendChild(d);
    });
    if (b.candidates.length) out.insertAdjacentHTML("beforeend", '<div class="hint">These are real NIPOST results. Confirm the one that is yours.</div>');
  } catch (e) { out.innerHTML = '<div class="info"><div class="warn">Could not reach the search. Check your connection.</div></div>'; }
};

// ---------- orders ----------
$("placeBtn").onclick = () => {
  const o = {
    id: "BL-" + Math.random().toString(36).slice(2, 7).toUpperCase(),
    created: Date.now(),
    name: $("cname").value.trim() || "Customer", phone: $("cphone").value.trim(),
    pickup: sel.pickup, drop: sel.drop, km, fee, status: "new", rider: null,
    // Paystack: add checkout here. Left unpaid in the prototype.
    paid: false,
  };
  store.orders = [o, ...store.orders];
  alert("Order " + o.id + " placed. Open Dispatch to assign a rider, or Track to follow it.");
};

function nearestRider(o) {
  return RIDERS.map((r) => ({ ...r, d: haversine([r.lat, r.lng], o.pickup.coords) })).sort((a, b) => a.d - b.d)[0];
}
function setStatus(id, status, rider) {
  store.orders = store.orders.map((o) => o.id === id ? { ...o, status, rider: rider || o.rider } : o);
  renderDispatch(); renderTrack();
}
window.assign = (id) => { const o = store.orders.find((x) => x.id === id); const r = nearestRider(o); setStatus(id, "assigned", { name: r.name, km: r.d }); };
window.advance = (id, s) => setStatus(id, s);

const STATUS_LABEL = { new: "New", assigned: "Rider assigned", picked_up: "On the way", delivered: "Delivered" };
let riderLayer = L.layerGroup().addTo(map2), orderLayer = L.layerGroup().addTo(map2);
function renderDispatch() {
  const os = store.orders;
  $("orders").innerHTML = os.length ? os.map((o) => `
    <div class="ocard">
      <div class="ohead"><b>${esc(o.id)}</b><span class="st ${o.status}">${STATUS_LABEL[o.status]}</span></div>
      <div class="route-line">${esc(o.pickup.code)} to ${esc(o.drop.code)}</div>
      <div class="meta">${esc(o.name)} · ${naira(o.fee)} · ${o.km.toFixed(1)} km${o.rider ? " · " + esc(o.rider.name) + ", " + o.rider.km.toFixed(1) + " km from pickup" : ""}</div>
      ${o.status === "new" ? `<button class="btn primary small" onclick="assign('${o.id}')">Assign nearest rider</button>` :
        o.status === "assigned" ? `<button class="btn soft small" onclick="advance('${o.id}','picked_up')">Mark picked up</button>` :
        o.status === "picked_up" ? `<button class="btn soft small" onclick="advance('${o.id}','delivered')">Mark delivered</button>` : ""}
    </div>`).join("")
    : '<div class="empty-state">No orders yet. Place one from the Order tab.</div>';
  $("riders").textContent = "Demo riders: " + RIDERS.map((r) => r.name).join(", ") + " (placed around Abuja)";
  riderLayer.clearLayers(); orderLayer.clearLayers();
  RIDERS.forEach((r) => L.circleMarker([r.lat, r.lng], { radius: 8, color: "#0b5d3b", fillColor: "#0b5d3b", fillOpacity: .85 }).addTo(riderLayer).bindPopup("Rider " + r.name));
  os.filter((o) => o.status !== "delivered").forEach((o) => L.marker(o.pickup.coords, { icon: pinIcon("p") }).addTo(orderLayer).bindPopup(o.id + " pickup"));
}

const STEPS = ["new", "assigned", "picked_up", "delivered"];
const STEP_LABEL = { new: "Order received", assigned: "Rider assigned", picked_up: "On the way", delivered: "Delivered" };
function renderTrack() {
  const os = store.orders; const box = $("trackBox");
  if (!os.length) { box.innerHTML = '<div class="empty-state">No orders to track yet. Place one from the Order tab.</div>'; return; }
  box.innerHTML = os.slice(0, 5).map((o) => {
    const i = STEPS.indexOf(o.status);
    return `<div class="tcard"><div class="ohead"><b>${esc(o.id)}</b><span class="meta" style="margin:0">${naira(o.fee)}</span></div>
      <div class="route-line">${esc(o.pickup.code)} to ${esc(o.drop.code)}</div>
      <ul class="steps">${STEPS.map((s, j) => `<li class="${j <= i ? "done" : ""}">${STEP_LABEL[s]}${s === "assigned" && o.rider && j <= i ? " · " + esc(o.rider.name) : ""}</li>`).join("")}</ul></div>`;
  }).join("");
}
renderDispatch(); renderTrack();
</script>
</body>
</html>
